[project]
name = "tableau-ai-demo-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.128.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "alembic>=1.18",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
    "httpx>=0.27",
    "requests>=2.31",
    "pyjwt>=2.8",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.0",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-openai>=0.2",
    "fastmcp>=2.0",
    "google-auth>=2.0",
    "jinja2>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "flake8>=7.0",
    "black>=24.0",
    "isort>=5.0",
]
