# Development overrides - use with: ./scripts/dev-docker.sh up
# Hot reload enabled; source code mounted as volumes.
# Ports and project name are set by dev-docker.sh from PWD (enables parallel worktrees).

services:
  backend:
    container_name: tableau-demo-${COMPOSE_PROJECT_NAME:-main}-backend
    dns:
      - 8.8.8.8
      - 8.8.4.4
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    networks:
      - default
      - tableau-demo-net
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:postgres@localhost:5432/tableau_demo}
      - REDIS_URL=${REDIS_URL:-redis://localhost:6379/0}
      - LOG_DIR=/app/logs
      - TABLEAU_SSL_CERT_PATH=/app/shared/server.crt
    volumes:
      - ${PROJECT_ROOT:-.}/backend/app:/app/app
      - ${PROJECT_ROOT:-.}/backend/mcp_server:/app/mcp_server
      - ${PROJECT_ROOT:-.}/backend/alembic:/app/alembic
      - ${PROJECT_ROOT:-.}/credentials:/app/credentials:ro
      - ${PROJECT_ROOT:-.}/backend/credentials:/app/backend/credentials:ro
      # shared/ contains server.crt; symlinks resolve to host paths, so mount the real file
      - ${CERT_PATH:-${PROJECT_ROOT:-.}/../shared}:/app/shared:ro
      - ${PROJECT_ROOT:-.}/backend/mcp_server/credentials:/app/mcp_server/credentials
      - ${PROJECT_ROOT:-.}/logs:/app/logs

  frontend:
    container_name: tableau-demo-${COMPOSE_PROJECT_NAME:-main}-frontend
    ports:
      - "${FRONTEND_HTTPS_PORT:-3000}:3000"
      - "${FRONTEND_HTTP_PORT:-3001}:3001"
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    environment:
      - NODE_ENV=development
      - HOSTNAME=0.0.0.0
      - BACKEND_API_URL=http://backend:8000
      - APP_BASE_URL=${APP_BASE_URL:-https://localhost:3000}
      - AUTH0_BASE_URL=${AUTH0_BASE_URL:-https://localhost:3000}
      - AUTH0_SECRET=${AUTH0_SECRET:-}
    healthcheck:
      test: ["CMD", "node", "-e", "require('https').get('https://localhost:3000', {rejectUnauthorized:false}, (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
    volumes:
      - ${PROJECT_ROOT:-.}/frontend:/app
      - frontend_node_modules:/app/node_modules
      # CERT_PATH: worktree symlinks don't resolve in containers; use shared/ (set in .env.worktree)
      - ${CERT_PATH:-${PROJECT_ROOT:-.}/frontend}/localhost-key.pem:/app/localhost-key.pem:ro
      - ${CERT_PATH:-${PROJECT_ROOT:-.}/frontend}/localhost.pem:/app/localhost.pem:ro

volumes:
  frontend_node_modules:
